<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  
  <div class="card">

    <div class="tabs">
      <div class="tab">Login</div>
      <div class="tab active">Sign Up</div>
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Join our sustainable fashion community today</p>

    <div class="row">
      <div class="field">
        <label>First Name</label>
        <input type="text" placeholder="John" />
      </div>
      <div class="field">
        <label>Last Name</label>
        <input type="text" placeholder="Doe" />
      </div>
    </div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" placeholder="your@email.com" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="••••••••" />
      <div class="hint">Minimum 8 characters</div>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <input type="password" placeholder="••••••••" />
    </div>

    <div class="checkbox">
      <input type="checkbox" />
      <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
    </div>

    <button class="btn-primary">Create Account →</button>

    <div class="divider">OR</div>

    <button class="social-btn google">Sign up with Google</button>
    <button class="social-btn facebook">Sign up with Facebook</button>

  </div>

</body>
</html>
